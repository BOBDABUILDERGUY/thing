<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live HTML Editor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: white;
            overflow: hidden;
        }

        header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: #111;
            border-bottom: 1px solid #333;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background: #0078d4;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #0065b3;
        }

        .editor-container {
            display: flex;
            height: calc(100vh - 60px);
        }

        .panel {
            width: 50%;
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            height: 40px;
            padding: 10px 15px;
            background: #252526;
            border-bottom: 1px solid #333;
            font-weight: bold;
        }

        #code {
            flex: 1;
            width: 100%;
            resize: none;
            border: none;
            outline: none;
            padding: 15px;
            background: #1e1e1e;
            color: #d4d4d4;
            font-family: Consolas, monospace;
            font-size: 15px;
            line-height: 1.5;
        }

        .preview {
            border-left: 2px solid #333;
            background: white;
        }

        iframe {
            flex: 1;
            width: 100%;
            border: none;
            background: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>⚡ Live HTML Editor</h1>
        <button onclick="resetEditor()">Reset</button>
    </header>

    <div class="editor-container">

        <!-- CODE PANEL -->
        <div class="panel">
            <div class="panel-title">
                HTML
            </div>

            <textarea id="code"><!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #0078d4;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Hello World!</h1>

    <p>Welcome to my HTML editor.</p>

    <button onclick="alert('Hello!')">
        Click Me
    </button>

</body>
</html></textarea>
        </div>

        <!-- PREVIEW PANEL -->
        <div class="panel preview">
            <div class="panel-title">
                Preview
            </div>

            <iframe id="preview"></iframe>
        </div>

    </div>

    <script>
        const code = document.getElementById("code");
        const preview = document.getElementById("preview");

        function updatePreview() {
            preview.srcdoc = code.value;
        }

        code.addEventListener("input", updatePreview);

        function resetEditor() {
            code.value = `<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #0078d4;
        }
    </style>
</head>

<body>

    <h1>Hello World!</h1>
    <p>Edit the HTML on the left!</p>

</body>
</html>`;

            updatePreview();
        }

        // Show the initial preview
        updatePreview();
    </script>

</body>
</html>
